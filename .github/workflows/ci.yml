name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check backend tests

      - name: Tests
        # MOCK_MODE keeps every provider offline: CI must never depend on a
        # third-party API being up, and must never need a key.
        env:
          MOCK_MODE: "true"
          LLM_PROVIDER: "none"
        run: pytest -q

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: crypto-intelligence:ci
      - name: Smoke test
        run: |
          docker run -d --name ci-smoke -p 8100:8100 \
            -e MOCK_MODE=true -e LLM_PROVIDER=none crypto-intelligence:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8100/api/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8100/api/health
          # The SPA must be served from the same origin as the API.
          curl -fsS http://127.0.0.1:8100/ | head -c 200
          docker rm -f ci-smoke
