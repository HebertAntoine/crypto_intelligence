[project]
name = "crypto-intelligence"
version = "0.1.0"
description = "Personal AI-assisted crypto market intelligence tool (BTC/ETH/SOL). Analysis only - never trades."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.9", "pydantic-settings>=2.5",
    "sqlalchemy>=2.0", "httpx>=0.27", "pandas>=2.2", "numpy>=2.0", "scipy>=1.14",
    "pyyaml>=6.0", "python-dotenv>=1.0", "apscheduler>=3.10", "feedparser>=6.0",
    "beautifulsoup4>=4.12", "lxml>=5.0", "pypdf>=5.0", "structlog>=24.0", "tenacity>=9.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "respx>=0.21"]

[project.scripts]
crypto-intel = "crypto_intel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["network: requires internet access (deselect with -m 'not network')"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
ignore_missing_imports = true

[tool.vercel]
entrypoint = "backend.crypto_intel.main:app"