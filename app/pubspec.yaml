name: crypto_intelligence_app
description: "Crypto Intelligence - market analysis client. Analysis only; never places orders."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  # One public socket opened by the app itself for BTC/ETH/SOL spot prices.
  # No API key and no Crypto Intelligence backend round-trip are involved.
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/api_snapshots/
    - assets/logos/
