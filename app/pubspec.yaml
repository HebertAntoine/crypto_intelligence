name: crypto_intelligence_app
description: "Crypto Intelligence - market analysis client. Analysis only; never places orders."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  # The only third-party dependency. Everything else ships with Flutter -
  # fewer packages means fewer things that can break a build months later.
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/api_snapshots/
